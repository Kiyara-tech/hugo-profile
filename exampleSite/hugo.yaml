              - **海内外全平台矩阵运营：** 统筹并精细化运营多渠道社交媒体阵地（Instagram、LinkedIn、B站、抖音、小红书、微博），把控跨平台传播节奏与内容适配。
              - **外部商务与文化对接：** 深入参与社群外部合作机制建立，负责与本地文化机构、青年艺术家及合作伙伴的沟通洽谈与资源整合。
