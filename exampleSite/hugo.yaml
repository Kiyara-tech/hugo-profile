      澳门科技大学葡语专业在读（辅修传播学）。具备扎实的葡语国家（PLP）区域研究背景与高敏感度的政经洞察力。

      深耕新媒体内容策划、全平台矩阵运营（IG / B站 / 抖音 / 小红书 / 微信公众号）、大型国际赛事一线采编及跨国经贸文化活动的公共关系执行。
